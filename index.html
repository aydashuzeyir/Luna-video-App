<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luna - Media Player</title>
    <!-- FontAwesome & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0b0c10;
            --card-bg: #14161f;
            --accent-pink: #ec4899;
            --text-color: #ffffff;
            --text-muted: #9ca3af;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Poppins', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 30px;
        }

        .container {
            width: 100%;
            max-width: 440px;
            padding: 16px;
            box-sizing: border-box;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        .logo-box h1 {
            font-size: 22px;
            font-weight: 700;
            color: var(--accent-pink);
            margin: 0;
        }
        .logo-box span {
            font-size: 11px;
            color: var(--text-muted);
        }
        .header-icons {
            display: flex;
            gap: 12px;
        }
        .header-icons i {
            font-size: 16px;
            cursor: pointer;
            color: var(--text-color);
            background: var(--card-bg);
            padding: 10px;
            border-radius: 12px;
        }

        /* Input Card Box */
        .main-card {
            background-color: var(--card-bg);
            border-radius: 20px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }
        .input-row {
            display: flex;
            align-items: center;
            background: rgba(255,255,255,0.04);
            border-radius: 12px;
            padding: 8px 12px;
            margin-bottom: 12px;
            gap: 10px;
        }
        .input-row i { color: var(--text-muted); font-size: 14px; }
        .input-row input {
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-color);
            font-size: 13px;
            width: 100%;
            font-family: 'Poppins', sans-serif;
        }
        .open-btn {
            background-color: var(--accent-pink);
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
        }

        .shortcuts-row {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: var(--text-muted);
            padding: 0 4px;
        }
        .shortcuts-row span { cursor: pointer; display: flex; align-items: center; gap: 6px; }

        /* Media Player Status Card */
        .player-status-card {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 14px 16px;
            margin-bottom: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }
        .player-info-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }
        .player-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 600;
            color: #f472b6;
        }
        .player-status-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            color: #4ade80;
            background: rgba(74, 222, 128, 0.1);
            padding: 3px 8px;
            border-radius: 20px;
        }
        .player-desc {
            font-size: 11px;
            color: var(--text-muted);
            margin: 0;
        }

        /* Nav Tabs (Daha sonra izlə & Yükləmələr) */
        .nav-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
        }
        .tab-btn {
            flex: 1;
            background-color: var(--card-bg);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 14px;
            padding: 12px 10px;
            color: var(--text-muted);
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-family: 'Poppins', sans-serif;
            transition: 0.2s;
        }
        .tab-btn.active {
            background: rgba(236, 72, 153, 0.15);
            color: var(--accent-pink);
            border-color: rgba(236, 72, 153, 0.3);
        }

        /* Platforms Section */
        .section-title {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 12px;
        }
        .platforms-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 16px;
        }
        .platform-btn {
            background-color: var(--card-bg);
            border: none;
            border-radius: 14px;
            padding: 12px 8px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-color);
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            transition: 0.2s;
        }
        .platform-btn:hover { background: rgba(255,255,255,0.06); }
        .platform-btn i { font-size: 15px; }

        /* Folder Card */
        .folder-card {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            margin-bottom: 12px;
        }
        .folder-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .folder-left i { font-size: 22px; color: #fbbf24; }
        .folder-info .f-title { font-size: 13px; font-weight: 600; margin-bottom: 2px; }
        .folder-info .f-count { font-size: 11px; color: var(--text-muted); }
        .folder-card > i { color: var(--text-muted); font-size: 14px; }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="logo-box">
                <h1>Luna</h1>
                <span>Media Player</span>
            </div>
            <div class="header-icons">
                <i class="fa-solid fa-rotate" onclick="location.reload()"></i>
                <i class="fa-solid fa-gear" onclick="alert('Ayarlar paneli')"></i>
            </div>
        </div>

        <!-- Main Search Card -->
        <div class="main-card">
            <div class="input-row">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="mediaLink" placeholder="Media linki yapışdırın...">
                <button class="open-btn" onclick="startPlayingLink()">Aç</button>
            </div>
            <div class="shortcuts-row">
                <span onclick="setLink('https://google.com')"><i class="fa-solid fa-globe" style="color:#3b82f6;"></i> Google</span>
                <span onclick="alert('Yeni qovluq yarat')"><i class="fa-solid fa-folder" style="color:#fbbf24;"></i> New Folder</span>
            </div>
        </div>

        <!-- Player Status Card -->
        <div class="player-status-card">
            <div class="player-info-top">
                <div class="player-title">
                    <i class="fa-solid fa-music"></i> Musiqi & Video Pleyeri
                </div>
                <div class="player-status-badge">
                    <i class="fa-solid fa-circle-check" style="font-size: 9px;"></i> Yüklə Hazır
                </div>
            </div>
            <p class="player-desc">Link daxil edərək tətbiq daxilinə saxlaya bilərsiniz.</p>
        </div>

        <!-- New Tabs: Daha sonra izlə & Yükləmələr -->
        <div class="nav-tabs">
            <button class="tab-btn active" onclick="switchTab(this, 'later')">
                <i class="fa-solid fa-clock" style="color: #fbbf24;"></i> Daha sonra izlə
            </button>
            <button class="tab-btn" onclick="switchTab(this, 'downloads')">
                <i class="fa-solid fa-download" style="color: #38bdf8;"></i> Yükləmələr
            </button>
        </div>

        <!-- Supported Platforms -->
        <div class="section-title">Dəstəklənən Platformalar</div>
        <div class="platforms-grid">
            <button class="platform-btn" onclick="setPlatform('spotify.com')"><i class="fa-brands fa-spotify" style="color:#22c55e;"></i> Spotify</button>
            <button class="platform-btn" onclick="setPlatform('pinterest.com')"><i class="fa-brands fa-pinterest" style="color:#ef4444;"></i> Pinterest</button>
            <button class="platform-btn" onclick="setPlatform('facebook.com')"><i class="fa-brands fa-facebook" style="color:#3b82f6;"></i> Facebook</button>
            <button class="platform-btn" onclick="setPlatform('instagram.com')"><i class="fa-brands fa-instagram" style="color:#ec4899;"></i> Instagram</button>
            <button class="platform-btn" onclick="setPlatform('threads.net')"><i class="fa-solid fa-at" style="color:#ffffff;"></i> Threads</button>
            <button class="platform-btn" onclick="setPlatform('twitter.com')"><i class="fa-brands fa-x-twitter" style="color:#ffffff;"></i> Twitter</button>
        </div>

        <!-- Folder List Item -->
        <div class="folder-card" onclick="alert('New Folder açıldı')">
            <div class="folder-left">
                <i class="fa-solid fa-folder"></i>
                <div class="folder-info">
                    <div class="f-title">New Folder</div>
                    <div class="f-count">0 fayl mövcuddur</div>
                </div>
            </div>
            <i class="fa-solid fa-chevron-right"></i>
        </div>
    </div>

    <script>
        function startPlayingLink() {
            const val = document.getElementById('mediaLink').value.trim();
            if (!val) { alert('Zəhmət olmasa link daxil edin!'); return; }
            alert('Link qəbul olundu: ' + val);
            document.getElementById('mediaLink').value = '';
        }

        function setLink(url) {
            document.getElementById('mediaLink').value = url;
        }

        function setPlatform(domain) {
            document.getElementById('mediaLink').value = 'https://www.' + domain + '/';
        }

        function switchTab(element, tabName) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');
            if(tabName === 'later') {
                alert('"Daha sonra izlə" bölməsi seçildi');
            } else {
                alert('"Yükləmələr" bölməsi seçildi');
            }
        }
    </script>
</body>
</html>
