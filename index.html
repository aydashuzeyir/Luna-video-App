<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luna - Media Launcher</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f172a;
            --surface: #1e293b;
            --surface-hover: #334155;
            --primary: #4f46e5;
            --primary-gradient: linear-gradient(135deg, #4f46e5, #8b5cf6);
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border: rgba(255, 255, 255, 0.08);
            --radius: 20px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg); color: var(--text-main); min-height: 100vh; display: flex; justify-content: center; padding: 16px; }
        .app-container { width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 16px; }

        header { display: flex; justify-content: space-between; align-items: center; padding: 4px 0; }
        .brand-box { display: flex; align-items: center; gap: 10px; }
        .brand-logo { color: #ef4444; font-size: 22px; }
        .brand-info h1 { font-size: 18px; font-weight: 700; line-height: 1.1; }
        .brand-info span { font-size: 10px; color: var(--text-sub); }

        .search-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; display: flex; flex-direction: column; gap: 12px; }
        .input-group { display: flex; align-items: center; gap: 10px; background: rgba(0, 0, 0, 0.3); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; }
        .input-group input { flex: 1; background: none; border: none; outline: none; color: var(--text-main); font-size: 14px; }
        .input-group input::placeholder { color: var(--text-sub); }

        .btn-row { display: flex; gap: 10px; }
        .action-btn { flex: 1; padding: 12px; border-radius: 12px; font-weight: 600; font-size: 14px; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; border: none; }
        .action-btn.primary { background: var(--primary-gradient); color: white; box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3); }
        .action-btn.outline { background: var(--surface-hover); color: var(--text-main); border: 1px solid var(--border); }

        .card-footer-links { display: flex; justify-content: space-between; align-items: center; font-size: 12px; font-weight: 500; color: var(--text-sub); padding: 0 4px; }
        .card-footer-links span { cursor: pointer; display: flex; align-items: center; gap: 6px; }

        .stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; display: flex; align-items: center; gap: 12px; }
        .stat-icon-box { width: 36px; height: 36px; border-radius: 10px; background: rgba(255, 255, 255, 0.05); display: flex; align-items: center; justify-content: center; font-size: 16px; }
        .stat-info span { font-size: 10px; font-weight: 600; color: var(--text-sub); text-transform: uppercase; }
        .stat-info p { font-size: 13px; font-weight: 700; color: var(--text-main); }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <div class="brand-box">
            <i class="fa-solid fa-fire brand-logo"></i>
            <div class="brand-info">
                <h1>Luna</h1>
                <span>YouTube Launcher</span>
            </div>
        </div>
    </header>

    <div class="search-card">
        <div class="input-group">
            <i class="fa-brands fa-youtube" style="color: #ef4444; font-size: 18px;"></i>
            <input type="text" id="mediaUrlInput" placeholder="Mahnı adı və ya YouTube linki...">
        </div>
        
        <div class="btn-row">
            <button class="action-btn primary" onclick="openYouTube()">
                <i class="fa-solid fa-play"></i> YouTube-da Aç
            </button>
            <button class="action-btn outline" onclick="saveOffline()">
                <i class="fa-solid fa-cloud-arrow-down" style="color: var(--primary);"></i> Yaddaşa At
            </button>
        </div>

        <div class="card-footer-links">
            <span onclick="openGoogle()"><i class="fa-brands fa-google" style="color: #4385f5;"></i> Google-da Axtar</span>
        </div>
    </div>

    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-icon-box" style="color: #3b82f6;"><i class="fa-solid fa-bolt"></i></div>
            <div class="stat-info">
                <span>Rejim</span>
                <p>Birbaşa Keçid</p>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon-box" style="color: #10b981;"><i class="fa-solid fa-volume-high"></i></div>
            <div class="stat-info">
                <span>Səs Vəziyyəti</span>
                <p>100% İşlək</p>
            </div>
        </div>
    </div>
</div>

<script>
    function openYouTube() {
        const val = document.getElementById('mediaUrlInput').value.trim();
        if(!val) return;

        let targetUrl = '';
        if (val.includes('youtu.be/') || val.includes('watch?v=')) {
            targetUrl = val; // Əgər birbaşa linkdirsə
        } else {
            targetUrl = `https://www.youtube.com/results?search_query=${encodeURIComponent(val)}`; // Əgər ad yazıbsa axtarışa atır
        }
        window.open(targetUrl, '_blank');
    }

    function saveOffline() {
        const val = document.getElementById('mediaUrlInput').value.trim();
        if(!val) return;
        alert("Fayl yaddaşa qeyd olundu!");
        document.getElementById('mediaUrlInput').value = '';
    }

    function openGoogle() {
        const val = document.getElementById('mediaUrlInput').value;
        window.open(val ? `https://www.google.com/search?q=${encodeURIComponent(val)}` : 'https://www.google.com', '_blank');
    }
</script>

</body>
</html>
