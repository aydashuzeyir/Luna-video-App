<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luna - Media Player & PWA</title>
    
    <meta name="description" content="Luna Media Player - Spotify, Pinterest, Instagram və digər platformalardan media linkləri daxil edərək musiqi dinləyin və yükləyin.">
    <meta name="keywords" content="Luna, media player, pwa app, musiqi yüklə, video player, spotify downloader">
    <meta name="author" content="Luna App">
    
    <link rel="manifest" href="./manifest.json">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #09090b;
            color: #ffffff;
            padding: 16px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 16px;
        }
        .title-area h1 {
            color: #ec4899;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 2px;
        }
        .title-area p {
            color: #a1a1aa;
            font-size: 12px;
        }
        .top-icons {
            display: flex;
            gap: 12px;
            align-items: center;
        }
        .icon-btn {
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 18px;
            cursor: pointer;
            padding: 4px;
        }
        .top-card {
            background-color: #18181b;
            border-radius: 16px;
            padding: 14px;
            margin-bottom: 12px;
        }
        .input-group {
            display: flex;
            gap: 8px;
            background-color: #27272a;
            border-radius: 12px;
            padding: 6px 12px;
            align-items: center;
            margin-bottom: 14px;
        }
        .input-group input {
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 13px;
            outline: none;
            width: 100%;
        }
        .input-group input::placeholder {
            color: #71717a;
        }
        .input-group button {
            background-color: #ec4899;
            color: white;
            border: none;
            padding: 6px 16px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
        }
        .action-row {
            display: flex;
            justify-content: space-between;
            padding: 0 4px;
        }
        .action-sub-btn {
            background: transparent;
            border: none;
            color: #d4d4d8;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }
        .status-box {
            background-color: #18181b;
            border-radius: 16px;
            padding: 14px;
            margin-bottom: 20px;
        }
        .status-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }
        .status-title {
            color: #ec4899;
            font-size: 13px;
            font-weight: 600;
        }
        .status-right {
            display: flex;
            gap: 10px;
            align-items: center;
            font-size: 11px;
            color: #a1a1aa;
        }
        .status-desc {
            color: #a1a1aa;
            font-size: 11px;
        }
        .platforms-title {
            font-size: 13px;
            color: #a1a1aa;
            margin-bottom: 10px;
        }
        .platforms-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 20px;
        }
        .platform-btn {
            background-color: #18181b;
            border: none;
            border-radius: 12px;
            padding: 10px 8px;
            color: white;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            cursor: pointer;
        }

        /* Ana səhifədə qovluq düyməsi */
        .folder-card {
            background-color: #18181b;
            border-radius: 16px;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            border: 1px solid #27272a;
        }
        .folder-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .folder-icon {
            font-size: 24px;
        }
        .folder-details h3 {
            font-size: 14px;
            color: #ffffff;
            margin-bottom: 2px;
        }
        .folder-details p {
            font-size: 11px;
            color: #a1a1aa;
        }

        /* Qovluq İçi Tam Ekran Səhifəsi (Əsas hissə) */
        #folderModal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #09090b;
            z-index: 9999;
            flex-direction: column;
            padding: 16px;
        }
        .folder-modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #27272a;
        }
        .folder-modal-header h2 {
            color: #ec4899;
            font-size: 18px;
        }
        .back-btn {
            background: #27272a;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
        }
        .folder-file-list {
            list-style: none;
            overflow-y: auto;
            flex-grow: 1;
        }
        .folder-file-item {
            background-color: #18181b;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #27272a;
        }
        .folder-file-item span {
            color: #d4d4d8;
            font-size: 13px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 220px;
        }
        .file-badge {
            background-color: #ec4899;
            color: white;
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: bold;
        }
        .empty-folder-text {
            color: #71717a;
            text-align: center;
            margin-top: 50px;
            font-size: 14px;
        }

        /* Format Seçim Modalı */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: #18181b;
            padding: 20px;
            border-radius: 16px;
            width: 90%;
            max-width: 320px;
            border: 1px solid #27272a;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            color: #ec4899;
            font-weight: bold;
            font-size: 15px;
        }
        .close-btn {
            background: none;
            border: none;
            color: #fff;
            font-size: 18px;
            cursor: pointer;
        }
        .format-btn {
            display: block;
            width: 100%;
            background-color: #27272a;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            text-align: left;
            margin-bottom: 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="title-area">
            <h1>Luna</h1>
            <p>Media Player</p>
        </div>
        <div class="top-icons">
            <button class="icon-btn" onclick="location.reload()">🔄</button>
        </div>
    </div>

    <div class="top-card">
        <div class="input-group">
            <input type="text" id="mediaLink" placeholder="Media linki yapışdırın...">
            <button onclick="checkAndOpenFormat()">Aç</button>
        </div>
        <div class="action-row">
            <button class="action-sub-btn" onclick="window.open('https://www.google.com', '_blank')">🌐 Google</button>
            <button class="action-sub-btn" onclick="openFolder()">📁 New Folder</button>
        </div>
    </div>

    <div class="status-box">
        <div class="status-header">
            <span class="status-title">🎵 Musiqi & Video Pleyeri</span>
            <div class="status-right">
                <span onclick="checkAndOpenFormat()" style="cursor:pointer; color:#ec4899;">📥 Yüklə</span>
                <span style="color: #22c55e; font-weight: 600;">Hazır</span>
            </div>
        </div>
        <p class="status-desc">Link daxil edərək tətbiq daxilinə saxlaya bilərsiniz.</p>
    </div>

    <div class="platforms-title">Dəstəklənən Platformalar</div>
    <div class="platforms-grid">
        <button class="platform-btn" onclick="checkAndOpenFormat()"><span style="color: #22c55e;">🎧</span> Spotify</button>
        <button class="platform-btn" onclick="checkAndOpenFormat()"><span style="color: #ef4444;">📌</span> Pinterest</button>
        <button class="platform-btn" onclick="checkAndOpenFormat()"><span style="color: #3b82f6;">💙</span> Facebook</button>
        <button class="platform-btn" onclick="checkAndOpenFormat()"><span style="color: #ec4899;">📷</span> Instagram</button>
        <button class="platform-btn" onclick="checkAndOpenFormat()"><span style="color: #60a5fa;">🧵</span> Threads</button>
        <button class="platform-btn" onclick="checkAndOpenFormat()"><span style="color: #f3f4f6;">✖️</span> Twitter</button>
    </div>

    <!-- Ana səhifədə toxunula bilən Qovluq Kartı -->
    <div class="folder-card" onclick="openFolder()">
        <div class="folder-info">
            <span class="folder-icon">📁</span>
            <div class="folder-details">
                <h3>New Folder</h3>
                <p id="mainFolderCount">0 fayl mövcuddur</p>
            </div>
        </div>
        <span style="color: #71717a; font-size: 16px;">➔</span>
    </div>

    <!-- Qovluğun İçi (Tam Ekran Açılan Səhifə) -->
    <div id="folderModal">
        <div class="folder-modal-header">
            <h2>📁 New Folder İçi</h2>
            <button class="back-btn" onclick="closeFolder()">Geri qayıt</button>
        </div>
        <div id="folderModalBody" class="folder-file-list">
            <div class="empty-folder-text">Qovluq hələ ki boşdur.</div>
        </div>
    </div>

    <!-- Format Seçim Modalı -->
    <div id="formatModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <span>Format Seçin</span>
                <button class="close-btn" onclick="document.getElementById('formatModal').style.display='none'">✕</button>
            </div>
            <p style="color: #a1a1aa; font-size: 12px; margin-bottom: 15px;">Yükləmək istədiyiniz formatı seçin:</p>
            <button class="format-btn" onclick="triggerDownload('MP3')">1. 🎵 MP3 (Audio)</button>
            <button class="format-btn" onclick="triggerDownload('MP4')">2. 🎬 MP4 (Video)</button>
        </div>
    </div>

    <script>
        let downloadedFiles = [];

        // Qovluğu açmaq üçün əsas funksiya
        function openFolder() {
            const modal = document.getElementById('folderModal');
            modal.style.display = 'flex';
            updateFolderUI();
        }

        // Qovluqdan geri qayıtmaq üçün funksiya
        function closeFolder() {
            const modal = document.getElementById('folderModal');
            modal.style.display = 'none';
        }

        function checkAndOpenFormat() {
            const val = document.getElementById('mediaLink').value.trim();
            if(!val) {
                alert('Zəhmət olmasa əvvəlcə xanaya link yapışdırın!');
                return;
            }
            document.getElementById('formatModal').style.display = 'flex';
        }

        function triggerDownload(formatType) {
            const val = document.getElementById('mediaLink').value.trim();
            document.getElementById('formatModal').style.display = 'none';

            let fileName = val.length > 25 ? val.substring(0, 25) + '...' : val;
            
            downloadedFiles.push({ name: fileName, format: formatType, fullLink: val });
            updateFolderUI();

            document.getElementById('mediaLink').value = '';
            alert(formatType + ' formatı "New Folder" qovluğuna əlavə olundu!');
        }

        function updateFolderUI() {
            const container = document.getElementById('folderModalBody');
            const mainCount = document.getElementById('mainFolderCount');
            
            mainCount.innerText = downloadedFiles.length + ' fayl mövcuddur';

            if(downloadedFiles.length === 0) {
                container.innerHTML = '<div class="empty-folder-text">Qovluq hələ ki boşdur.</div>';
                return;
            }

            let html = '';
            downloadedFiles.forEach((file, index) => {
                html += `<li class="folder-file-item" onclick="alert('Oxunur: ${file.fullLink}')" style="cursor:pointer;">
                            <span>${index + 1}. ${file.name}</span>
                            <span class="file-badge">${file.format}</span>
                         </li>`;
            });
            container.innerHTML = html;
        }
    </script>
</body>
</html>
