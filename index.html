<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luna</title>
    <link rel="manifest" href="./manifest.json">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #09090b;
            color: #ffffff;
            padding: 16px;
            transition: background 0.3s, color 0.3s;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 16px;
        }
        .title-area h1 {
            color: #ec4899;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 2px;
        }
        .title-area p {
            color: #a1a1aa;
            font-size: 12px;
        }
        .top-icons {
            display: flex;
            gap: 12px;
            align-items: center;
        }
        .icon-btn {
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 18px;
            cursor: pointer;
            padding: 4px;
        }
        .top-card {
            background-color: #18181b;
            border-radius: 16px;
            padding: 14px;
            margin-bottom: 12px;
        }
        .input-group {
            display: flex;
            gap: 8px;
            background-color: #27272a;
            border-radius: 12px;
            padding: 6px 12px;
            align-items: center;
            margin-bottom: 14px;
        }
        .input-group input {
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 13px;
            outline: none;
            width: 100%;
        }
        .input-group input::placeholder {
            color: #71717a;
        }
        .input-group button {
            background-color: #ec4899;
            color: white;
            border: none;
            padding: 6px 16px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
        }
        .action-row {
            display: flex;
            justify-content: space-between;
            padding: 0 4px;
        }
        .action-sub-btn {
            background: transparent;
            border: none;
            color: #d4d4d8;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }
        .status-box {
            background-color: #18181b;
            border-radius: 16px;
            padding: 14px;
            margin-bottom: 20px;
        }
        .status-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }
        .status-title {
            color: #ec4899;
            font-size: 13px;
            font-weight: 600;
        }
        .status-right {
            display: flex;
            gap: 10px;
            align-items: center;
            font-size: 11px;
            color: #a1a1aa;
        }
        .status-desc {
            color: #a1a1aa;
            font-size: 11px;
        }
        .platforms-title {
            font-size: 13px;
            color: #a1a1aa;
            margin-bottom: 10px;
        }
        .platforms-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }
        .platform-btn {
            background-color: #18181b;
            border: none;
            border-radius: 12px;
            padding: 10px 8px;
            color: white;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            cursor: pointer;
        }
        /* Modal Ayarlar Pəncərəsi */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: #18181b;
            padding: 20px;
            border-radius: 16px;
            width: 90%;
            max-width: 320px;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            color: #ec4899;
            font-weight: bold;
        }
        .close-btn {
            background: none;
            border: none;
            color: #fff;
            font-size: 18px;
            cursor: pointer;
        }
        .setting-group {
            margin-bottom: 12px;
        }
        .setting-group label {
            font-size: 12px;
            color: #a1a1aa;
            display: block;
            margin-bottom: 5px;
        }
        .setting-group select {
            width: 100%;
            background: #27272a;
            color: #fff;
            border: none;
            padding: 8px;
            border-radius: 8px;
            outline: none;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="title-area">
            <h1>Luna</h1>
            <p>Media Player & Google Girişi</p>
        </div>
        <div class="top-icons">
            <button class="icon-btn" title="Axtarış" onclick="alert('Axtarış bölməsi aktivdir')">🔍</button>
            <button class="icon-btn" title="Ayarlar" onclick="openSettings()">⚙️</button>
            <button class="icon-btn" title="Yenilə" onclick="location.reload()">🔄</button>
        </div>
    </div>

    <div class="top-card">
        <div class="input-group">
            <input type="text" placeholder="Spotify / Media linki yapışdırın...">
            <button onclick="alert('Link qəbul olundu!')">Aç</button>
        </div>
        <div class="action-row">
            <button class="action-sub-btn" onclick="alert('Google Girişinə keçid edilir...')">🌐 Google-a Get</button>
            <button class="action-sub-btn" onclick="alert('Yeni qovluq yaradıldı')">📁 New Folder</button>
        </div>
    </div>

    <div class="status-box">
        <div class="status-header">
            <span class="status-title">🎵 Musiqi & Video Pleyeri</span>
            <div class="status-right">
                <span onclick="location.reload()" style="cursor:pointer">🔄 Yenilə</span>
                <span onclick="alert('Yüklənir...')" style="cursor:pointer">📥 Yüklə</span>
                <span style="color: #22c55e; font-weight: 600;">Hazır</span>
            </div>
        </div>
        <p class="status-desc">Link daxil edərək musiqini dinləyə və yükləyə bilərsiniz.</p>
    </div>

    <div class="platforms-title">Dəstəklənən Platformalar</div>
    <div class="platforms-grid">
        <button class="platform-btn" onclick="alert('Spotify seçildi')"><span style="color: #22c55e;">🎧</span> Spotify</button>
        <button class="platform-btn" onclick="alert('Pinterest seçildi')"><span style="color: #ef4444;">📌</span> Pinterest</button>
        <button class="platform-btn" onclick="alert('Facebook seçildi')"><span style="color: #3b82f6;">💙</span> Facebook</button>
        <button class="platform-btn" onclick="alert('Instagram seçildi')"><span style="color: #ec4899;">📷</span> Instagram</button>
        <button class="platform-btn" onclick="alert('Threads seçildi')"><span style="color: #60a5fa;">🧵</span> Threads</button>
        <button class="platform-btn" onclick="alert('Twitter seçildi')"><span style="color: #f3f4f6;">✖️</span> Twitter (X)</button>
    </div>

    <!-- Ayarlar Modalı (Temalar və Fontlar üçün) -->
    <div id="settingsModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <span>Tənzimləmələr</span>
                <button class="close-btn" onclick="closeSettings()">✕</button>
            </div>
            <div class="setting-group">
                <label>Tema Seçimi</label>
                <select id="themeSelect" onchange="changeTheme(this.value)">
                    <option value="dark">Tənha Qara (Default)</option>
                    <option value="midnight">Göyçə / Midnight</option>
                    <option value="pinkish">Çəhrayı Vibe</option>
                </select>
            </div>
            <div class="setting-group">
                <label>Şrift (Font) Stili</label>
                <select id="fontSelect" onchange="changeFont(this.value)">
                    <option value="system">Sistem Şrifti</option>
                    <option value="monospace">Kod (Monospace)</option>
                    <option value="serif">Klassik (Serif)</option>
                </select>
            </div>
        </div>
    </div>

    <script>
        function openSettings() {
            document.getElementById('settingsModal').style.display = 'flex';
        }
        function closeSettings() {
            document.getElementById('settingsModal').style.display = 'none';
        }
        function changeTheme(theme) {
            if(theme === 'dark') {
                document.body.style.backgroundColor = '#09090b';
            } else if(theme === 'midnight') {
                document.body.style.backgroundColor = '#0f172a';
            } else if(theme === 'pinkish') {
                document.body.style.backgroundColor = '#1f101a';
            }
        }
        function changeFont(font) {
            if(font === 'system') {
                document.body.style.fontFamily = '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
            } else if(font === 'monospace') {
                document.body.style.fontFamily = 'monospace';
            } else if(font === 'serif') {
                document.body.style.fontFamily = 'serif';
            }
        }
    </script>

</body>
</html>
