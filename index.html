<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luna - Ultimate Media & Sound Center</title>
    
    <!-- Google Fonts (Bol Şrift Seçimi) -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Orbitron:wght@500;700&family=Cairo:wght@400;700&family=Pacifico&family=Press+Start+2P&family=Roboto+Mono:wght@400;700&family=Cinzel:wght@500;700&display=swap" rel="stylesheet">
    
    <!-- FontAwesome İkonlar -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary-color: #ec4899;
            --bg-color: #09090b;
            --card-bg: #18181b;
            --input-bg: #27272a;
            --font-family: 'Poppins', sans-serif;
            --font-color: #ffffff;
            --subtext-color: #a1a1aa;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--font-family);
            color: var(--font-color);
        }
        body {
            background-color: var(--bg-color);
            padding: 16px;
            padding-bottom: 95px;
            transition: background 0.3s, color 0.3s;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 16px;
        }
        .title-area h1 {
            color: var(--primary-color);
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 2px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .title-area p {
            color: var(--subtext-color);
            font-size: 12px;
        }
        .top-icons {
            display: flex;
            gap: 12px;
            align-items: center;
        }
        .icon-btn {
            background: transparent;
            border: none;
            font-size: 18px;
            cursor: pointer;
            padding: 4px;
            transition: transform 0.2s;
        }
        .icon-btn:hover { transform: scale(1.15); }

        .top-card {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 14px;
            margin-bottom: 12px;
            border: 1px solid var(--input-bg);
        }
        .input-group {
            display: flex;
            gap: 8px;
            background-color: var(--input-bg);
            border-radius: 12px;
            padding: 6px 12px;
            align-items: center;
            margin-bottom: 10px;
        }
        .input-group i {
            color: #38bdf8;
            font-size: 15px;
        }
        .input-group input {
            background: transparent;
            border: none;
            color: var(--font-color);
            font-size: 13px;
            outline: none;
            width: 100%;
        }
        .input-group input::placeholder {
            color: var(--subtext-color);
        }
        .btn-row {
            display: grid;
            grid-template-columns: 1fr;
            gap: 8px;
            margin-bottom: 10px;
        }
        .main-action-btn {
            background: linear-gradient(135deg, var(--primary-color), #8b5cf6);
            color: white;
            border: none;
            padding: 10px 12px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .action-row {
            display: flex;
            justify-content: space-between;
            padding: 0 4px;
        }
        .action-sub-btn {
            background: transparent;
            border: none;
            color: var(--subtext-color);
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }

        .platforms-title {
            font-size: 13px;
            color: var(--subtext-color);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .platforms-title i { color: #f43f5e; }

        .platforms-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 16px;
        }
        .platform-btn {
            background-color: var(--card-bg);
            border: 1px solid var(--input-bg);
            border-radius: 12px;
            padding: 10px 8px;
            color: var(--font-color);
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            cursor: pointer;
            transition: 0.2s;
        }
        .platform-btn:hover { border-color: var(--primary-color); }

        .hub-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin-bottom: 20px;
        }
        .hub-card {
            background-color: var(--card-bg);
            border: 1px solid var(--input-bg);
            border-radius: 14px;
            padding: 12px 8px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
        }
        .hub-card:hover { border-color: var(--primary-color); transform: translateY(-2px); }
        .hub-card span { font-size: 11px; font-weight: 600; display: block; }
        .hub-card small { font-size: 9px; color: var(--subtext-color); }

        /* Media Mərkəzi Modal */
        #mediaCenterModal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-color);
            z-index: 9999;
            flex-direction: column;
            padding: 16px;
        }
        .modal-top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--input-bg);
        }
        .modal-top-bar h2 { color: var(--primary-color); font-size: 16px; display: flex; gap: 8px; align-items: center; }
        
        .media-tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 14px;
            background: var(--card-bg);
            padding: 4px;
            border-radius: 10px;
            border: 1px solid var(--input-bg);
        }
        .tab-btn {
            flex: 1;
            background: transparent;
            border: none;
            padding: 8px;
            font-size: 11px;
            font-weight: 600;
            color: var(--subtext-color);
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .tab-btn.active {
            background: var(--primary-color);
            color: white;
        }

        .tab-content {
            display: none;
            flex-grow: 1;
            overflow-y: auto;
            list-style: none;
        }
        .tab-content.active {
            display: block;
        }
        .media-item-row {
            background-color: var(--card-bg);
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid var(--input-bg);
            cursor: pointer;
        }
        .media-item-info {
            display: flex;
            align-items: center;
            gap: 10px;
            overflow: hidden;
        }
        .media-item-info span {
            font-size: 12px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 180px;
        }
        .badge {
            background-color: var(--input-bg);
            color: #38bdf8;
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 10px;
            font-weight: bold;
        }
        .empty-text {
            color: var(--subtext-color);
            text-align: center;
            margin-top: 40px;
            font-size: 12px;
        }

        /* Mini Pleyer */
        #persistentMiniPlayer {
            display: none;
            position: fixed;
            bottom: 0; left: 0; width: 100%;
            background: var(--card-bg);
            border-top: 1px solid var(--input-bg);
            padding: 10px 16px;
            z-index: 999;
            align-items: center;
            gap: 12px;
            box-shadow: 0 -4px 10px rgba(0,0,0,0.5);
        }
        .mini-info { flex-grow: 1; overflow: hidden; cursor: pointer; }
        .mini-title {
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .mini-slider {
            width: 100%;
            appearance: none;
            height: 4px;
            background: var(--input-bg);
            border-radius: 2px;
            outline: none;
            cursor: pointer;
        }
        .mini-slider::-webkit-slider-thumb {
            appearance: none;
            width: 10px; height: 10px;
            border-radius: 50%;
            background: var(--primary-color);
        }
        .mini-btn {
            background: var(--input-bg);
            color: #f43f5e;
            border: none;
            width: 32px; height: 32px;
            border-radius: 50%;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Tam Ekran Pleyer */
        #fullPlayerModal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: var(--bg-color);
            z-index: 20000;
            flex-direction: column;
            justify-content: space-between;
            padding: 24px 20px;
        }
        .full-top-bar { display: flex; justify-content: space-between; align-items: center; }
        .full-close-btn { background: none; border: none; color: #a855f7; font-size: 22px; cursor: pointer; }
        
        .album-art-container { width: 100%; display: flex; justify-content: center; align-items: center; margin: 10px 0; }
        .album-art {
            width: 100%; max-width: 280px; height: 170px; border-radius: 16px; background: var(--card-bg);
            display: flex; justify-content: center; align-items: center; overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 2px solid var(--input-bg);
        }
        .album-art iframe { width: 100%; height: 100%; border: none; }

        .song-meta-info { text-align: center; margin-bottom: 10px; padding: 0 10px; }
        .full-song-title { font-size: 14px; font-weight: bold; margin-bottom: 4px; word-break: break-all; color: #38bdf8; }
        .full-song-artist { font-size: 12px; color: var(--subtext-color); }
        
        .full-player-controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; padding: 0 10px; }
        .ctrl-sub-btn, .ctrl-main-btn { background: transparent; border: none; cursor: pointer; }
        .ctrl-sub-btn { font-size: 18px; color: #38bdf8; }
        .ctrl-main-btn {
            width: 50px; height: 50px; border-radius: 50%; background: var(--input-bg);
            display: flex; justify-content: center; align-items: center; font-size: 18px; color: #22c55e;
        }
        .progress-container { margin-bottom: 10px; }
        .full-seeker {
            width: 100%; appearance: none; height: 5px; background: var(--input-bg);
            border-radius: 3px; outline: none; margin-bottom: 8px; cursor: pointer;
        }
        .full-seeker::-webkit-slider-thumb { appearance: none; width: 12px; height: 12px; border-radius: 50%; background: var(--primary-color); }
        .time-row { display: flex; justify-content: space-between; font-size: 11px; color: var(--subtext-color); }
        .audio-specs { text-align: center; font-size: 11px; color: var(--subtext-color); margin-bottom: 5px; letter-spacing: 1px; }

        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); justify-content: center; align-items: center; z-index: 1000;
        }
        .modal-content {
            background: var(--card-bg); padding: 20px; border-radius: 16px; width: 90%;
            max-width: 360px; border: 1px solid var(--input-bg); max-height: 85vh; overflow-y: auto;
        }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; color: var(--primary-color); font-weight: bold; font-size: 15px; }
        .close-btn { background: none; border: none; color: var(--font-color); font-size: 18px; cursor: pointer; }
        .setting-group { margin-bottom: 14px; }
        .setting-group label { font-size: 12px; color: var(--subtext-color); display: block; margin-bottom: 5px; }
        .setting-group select {
            width: 100%; background: var(--input-bg); color: var(--font-color); border: none; padding: 8px; border-radius: 8px; outline: none; font-size: 13px;
        }
        .format-btn {
            display: block; width: 100%; background-color: var(--input-bg); color: var(--font-color);
            border: none; padding: 12px; border-radius: 10px; font-size: 14px; font-weight: 600; text-align: left; margin-bottom: 10px; cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="title-area">
            <h1><i id="appLogoIcon" class="fa-solid fa-moon" style="color: #f43f5e;"></i> <span id="appNameText">Luna</span></h1>
            <p>Ultimate Media & Sound Center</p>
        </div>
        <div class="top-icons">
            <button class="icon-btn" title="Yenilə" onclick="playSoundEffect('pop'); location.reload()"><i class="fa-solid fa-rotate" style="color: #38bdf8;"></i></button>
            <button class="icon-btn" title="Bol Səslər & Effektlər" onclick="playSoundEffect('chime'); openSoundModal()"><i class="fa-solid fa-volume-high" style="color: #22c55e;"></i></button>
            <button class="icon-btn" title="Ayarlar" onclick="playSoundEffect('click'); openSettings()"><i class="fa-solid fa-gear" style="color: #a855f7;"></i></button>
        </div>
    </div>

    <!-- Giriş və Əsas Əməliyyat Paneli -->
    <div class="top-card">
        <div class="input-group">
            <i class="fa-solid fa-link"></i>
            <input type="text" id="mediaLink" placeholder="YouTube linki və ya səs ünvanı...">
        </div>
        <div class="btn-row">
            <button class="main-action-btn" onclick="playSoundEffect('pop'); startPlayingLink()"><i class="fa-solid fa-play"></i> Saytda Dinlə / İzlə</button>
        </div>
        <div class="action-row">
            <button class="action-sub-btn" onclick="playSoundEffect('click'); window.open('https://www.google.com', '_blank')"><i class="fa-brands fa-google" style="color: #ea4335;"></i> Google</button>
            <button class="action-sub-btn" onclick="playSoundEffect('click'); openMediaCenter('history')"><i class="fa-solid fa-folder-open" style="color: #f97316;"></i> Siyahım</button>
        </div>
    </div>

    <!-- Sürətli Keçid Hub Paneli -->
    <div class="hub-grid">
        <div class="hub-card" onclick="playSoundEffect('click'); openMediaCenter('history')">
            <i class="fa-solid fa-clock-rotate-left" style="font-size: 20px; color: #38bdf8; margin-bottom: 6px; display: block;"></i>
            <span>Dinləmə Tarixçəsi</span>
            <small id="hubHistoryCount">0 qeyd</small>
        </div>
        <div class="hub-card" onclick="playSoundEffect('click'); openMediaCenter('watchlater')">
            <i class="fa-solid fa-bookmark" style="font-size: 20px; color: #eab308; margin-bottom: 6px; display: block;"></i>
            <span>Seçilmişlər</span>
            <small id="hubWatchLaterCount">0 qeyd</small>
        </div>
    </div>

    <div class="platforms-title"><i class="fa-solid fa-globe"></i> Dəstəklənən Şəbəkələr</div>
    <div class="platforms-grid">
        <button class="platform-btn" onclick="playSoundEffect('click')"><i class="fa-brands fa-youtube" style="font-size: 16px; color: #ef4444;"></i> YouTube</button>
        <button class="platform-btn" onclick="playSoundEffect('click')"><i class="fa-brands fa-spotify" style="font-size: 16px; color: #22c55e;"></i> Spotify</button>
        <button class="platform-btn" onclick="playSoundEffect('click')"><i class="fa-brands fa-instagram" style="font-size: 16px; color: #ec4899;"></i> Instagram</button>
        <button class="platform-btn" onclick="playSoundEffect('click')"><i class="fa-brands fa-pinterest" style="font-size: 16px; color: #f87171;"></i> Pinterest</button>
        <button class="platform-btn" onclick="playSoundEffect('click')"><i class="fa-brands fa-facebook" style="font-size: 16px; color: #3b82f6;"></i> Facebook</button>
        <button class="platform-btn" onclick="playSoundEffect('click')"><i class="fa-brands fa-tiktok" style="font-size: 16px; color: #ffffff;"></i> TikTok</button>
    </div>

    <!-- Daxili Media Mərkəzi Modalı -->
    <div id="mediaCenterModal">
        <div class="modal-top-bar">
            <h2><i class="fa-solid fa-layer-group" style="color: #a855f7;"></i> Media Mərkəzi</h2>
            <button class="secondary-action-btn" style="width: auto; padding: 6px 12px;" onclick="playSoundEffect('click'); closeMediaCenter()"><i class="fa-solid fa-xmark" style="color: #ef4444;"></i> Bağla</button>
        </div>
        
        <div class="media-tabs">
            <button class="tab-btn active" onclick="switchTab('history', this)"><i class="fa-solid fa-clock-rotate-left" style="color: #38bdf8;"></i> Tarixçə</button>
            <button class="tab-btn" onclick="switchTab('watchlater', this)"><i class="fa-solid fa-bookmark" style="color: #eab308;"></i> Seçilmişlər</button>
        </div>

        <ul id="tabHistory" class="tab-content active">
            <div class="empty-text">Tarixçə boşdur.</div>
        </ul>
        <ul id="tabWatchLater" class="tab-content">
            <div class="empty-text">Seçilmişlər siyahısı boşdur.</div>
        </ul>
    </div>

    <!-- Mini Pleyer -->
    <div id="persistentMiniPlayer">
        <div class="mini-info" onclick="playSoundEffect('click'); openFullPlayer()">
            <div class="mini-title" id="miniSongTitle"><i class="fa-solid fa-compact-disc" style="color: #a855f7;"></i> Fayl adı</div>
            <input type="range" id="miniSeeker" class="mini-slider" value="0" max="100" step="1">
        </div>
        <div style="display: flex; gap: 8px; align-items: center;">
            <button class="mini-btn" id="miniPlayBtn" onclick="playSoundEffect('click'); togglePlayPause()"><i class="fa-solid fa-pause"></i></button>
        </div>
    </div>

    <!-- Tam Ekran Pleyer -->
    <div id="fullPlayerModal">
        <div class="full-top-bar">
            <button class="full-close-btn" onclick="playSoundEffect('click'); closeFullPlayer()"><i class="fa-solid fa-chevron-down"></i></button>
            <span style="font-size: 13px; font-weight: 600; letter-spacing: 1px;"><i class="fa-solid fa-headphones" style="color: #ec4899;"></i> PLEYER</span>
            <button class="full-close-btn" onclick="playSoundEffect('click'); openSettings()"><i class="fa-solid fa-gear"></i></button>
        </div>

        <div class="album-art-container">
            <div class="album-art" id="playerArtContainer">
                <i class="fa-solid fa-music" style="font-size: 40px; color: #38bdf8;"></i>
            </div>
        </div>

        <div class="song-meta-info">
            <div class="full-song-title" id="fullSongTitle">Mahnı adı</div>
            <div class="full-song-artist" id="fullSongArtist">Luna Media Engine</div>
        </div>

        <div>
            <div class="full-player-controls">
                <button class="ctrl-sub-btn" onclick="playSoundEffect('click')"><i class="fa-solid fa-shuffle"></i></button>
                <button class="ctrl-sub-btn" onclick="playSoundEffect('click'); skipTime(-10)"><i class="fa-solid fa-backward-step"></i></button>
                <button class="ctrl-main-btn" id="fullPlayBtn" onclick="playSoundEffect('click'); togglePlayPause()"><i class="fa-solid fa-pause"></i></button>
                <button class="ctrl-sub-btn" onclick="playSoundEffect('click'); skipTime(10)"><i class="fa-solid fa-forward-step"></i></button>
                <button class="ctrl-sub-btn" onclick="playSoundEffect('click')"><i class="fa-solid fa-repeat"></i></button>
            </div>

            <div class="progress-container">
                <input type="range" id="fullSeeker" class="full-seeker" value="0" max="100" step="1">
                <div class="time-row">
                    <span id="currentTimeText">00:00</span>
                    <span id="durationText">00:00</span>
                </div>
            </div>

            <div class="audio-specs" id="audioSpecsText">Online Stream • 320 kb/s</div>
        </div>
    </div>

    <audio id="globalAudio" style="display: none;"></audio>

    <!-- Səslər Modalı -->
    <div id="soundModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <span><i class="fa-solid fa-volume-high" style="color: #22c55e;"></i> Bol Səslər & Effektlər</span>
                <button class="close-btn" onclick="playSoundEffect('click'); closeSoundModal()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <button class="format-btn" onclick="playSoundEffect('bell')"><i class="fa-solid fa-bell" style="color: #eab308; margin-right: 8px;"></i> Zəng Səsi (Bell)</button>
            <button class="format-btn" onclick="playSoundEffect('laser')"><i class="fa-solid fa-bolt" style="color: #38bdf8; margin-right: 8px;"></i> Lazer Efekti</button>
            <button class="format-btn" onclick="playSoundEffect('pop')"><i class="fa-solid fa-circle-dot" style="color: #f43f5e; margin-right: 8px;"></i> Pop Efekti</button>
            <button class="format-btn" onclick="playSoundEffect('chime')"><i class="fa-solid fa-wand-magic-sparkles" style="color: #a855f7; margin-right: 8px;"></i> Sehrli Çime</button>
        </div>
    </div>

    <!-- Ayarlar Modalı (Bol İkon, Tema və Şrift Seçimi) -->
    <div id="settingsModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <span><i class="fa-solid fa-palette" style="color: #ec4899;"></i> İkon, Tema və Şriftlər</span>
                <button class="close-btn" onclick="playSoundEffect('click'); closeSettings()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <div class="setting-group">
                <label><i class="fa-solid fa-icons" style="color: #38bdf8;"></i> Tətbiq İkonu</label>
                <select id="appIconSelect" onchange="changeAppIcon(this.value)">
                    <option value="fa-moon">🌙 Ay (Moon)</option>
                    <option value="fa-headphones">🎧 Qulaqlıq (Headphones)</option>
                    <option value="fa-compact-disc">💿 Disk (CD)</option>
                    <option value="fa-fire">🔥 Od / Trend (Fire)</option>
                    <option value="fa-bolt">⚡ Şimşək (Bolt)</option>
                    <option value="fa-crown">👑 Tac (Crown)</option>
                    <option value="fa-rocket">🚀 Raket (Rocket)</option>
                    <option value="fa-skull">💀 Baş sümüyü (Skull)</option>
                    <option value="fa-heart">💖 Ürək (Heart)</option>
                    <option value="fa-star">⭐ Ulduz (Star)</option>
                </select>
            </div>

            <div class="setting-group">
                <label><i class="fa-solid fa-brush" style="color: #22c55e;"></i> Rəng Teması</label>
                <select id="themeSelect" onchange="changeTheme(this.value)">
                    <option value="pink">💖 Neon Çəhrayı (Default)</option>
                    <option value="blue">💙 Göy Okean (Ocean)</option>
                    <option value="purple">💜 Sehrli Bənövşəyi (Magic)</option>
                    <option value="green">💚 Matris Yaşıl (Matrix)</option>
                    <option value="gold">💛 Qızıl Lüks (Gold)</option>
                    <option value="red">❤️ Qırmızı Alov (Fire Red)</option>
                    <option value="dark">🖤 Tam Qara / Minimal (Dark)</option>
                </select>
            </div>

            <div class="setting-group">
                <label><i class="fa-solid fa-font" style="color: #eab308;"></i> Şrift (Font) Stili</label>
                <select id="fontSelect" onchange="changeFont(this.value)">
                    <option value="'Poppins', sans-serif">Poppins (Standart)</option>
                    <option value="'Orbitron', sans-serif">Orbitron (Robotik / Sci-Fi)</option>
                    <option value="'Cairo', sans-serif">Cairo (Müasir / Geniş)</option>
                    <option value="'Pacifico', cursive">Pacifico (Əlyazma)</option>
                    <option value="'Press Start 2P', cursive">Press Start 2P (Retro Oyun)</option>
                    <option value="'Roboto Mono', monospace">Roboto Mono (Kod / Monospaced)</option>
                    <option value="'Cinzel', serif">Cinzel (Klassik / Premium)</option>
                </select>
            </div>
        </div>
    </div>

    <script>
        function openSettings() { document.getElementById('settingsModal').style.display = 'flex'; }
        function closeSettings() { document.getElementById('settingsModal').style.display = 'none'; }
        function openSoundModal() { document.getElementById('soundModal').style.display = 'flex'; }
        function closeSoundModal() { document.getElementById('soundModal').style.display = 'none'; }
        function openFullPlayer() { document.getElementById('fullPlayerModal').style.display = 'flex'; }
        function closeFullPlayer() { document.getElementById('fullPlayerModal').style.display = 'none'; }

        function changeAppIcon(iconClass) {
            document.getElementById('appLogoIcon').className = `fa-solid ${iconClass}`;
        }

        function changeTheme(themeName) {
            let primary = '#ec4899';
            let bg = '#09090b';
            let card = '#18181b';
            let input = '#27272a';

            if(themeName === 'blue') {
                primary = '#38bdf8'; bg = '#0b0f19'; card = '#1e293b'; input = '#334155';
            } else if(themeName === 'purple') {
                primary = '#a855f7'; bg = '#0f0715'; card = '#201033'; input = '#321a4f';
            } else if(themeName === 'green') {
                primary = '#22c55e'; bg = '#06130b'; card = '#0f2918'; input = '#183d25';
            } else if(themeName === 'gold') {
                primary = '#eab308'; bg = '#141208'; card = '#29240f'; input = '#3d3618';
            } else if(themeName === 'red') {
                primary = '#ef4444'; bg = '#140808'; card = '#2b1111'; input = '#401a1a';
            } else if(themeName === 'dark') {
                primary = '#ffffff'; bg = '#000000'; card = '#111111'; input = '#222222';
            }

            document.documentElement.style.setProperty('--primary-color', primary);
            document.documentElement.style.setProperty('--bg-color', bg);
            document.documentElement.style.setProperty('--card-bg', card);
            document.documentElement.style.setProperty('--input-bg', input);
        }

        function changeFont(fontFamily) {
            document.documentElement.style.setProperty('--font-family', fontFamily);
        }

        function playSoundEffect(type) {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            let now = ctx.currentTime;
            
            if(type === 'pop') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.exponentialRampToValueAtTime(600, now + 0.1);
                gain.gain.setValueAtTime(0.4, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
                osc.start(now); osc.stop(now + 0.1);
            } else if(type === 'bell') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, now);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
                osc.start(now); osc.stop(now + 0.3);
            } else if(type === 'laser') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(900, now);
                osc.frequency.exponentialRampToValueAtTime(100, now + 0.2);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
                osc.start(now); osc.stop(now + 0.2);
            } else {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(500, now);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
                osc.start(now); osc.stop(now + 0.1);
            }
        }

        let historyList = [];
        let watchLaterList = [];
        let currentActiveLink = '';
        const globalAudio = document.getElementById('globalAudio');

        function openMediaCenter(tabName) {
            document.getElementById('mediaCenterModal').style.display = 'flex';
            const tabs = document.querySelectorAll('.media-tabs .tab-btn');
            if(tabName === 'history') switchTab('history', tabs[0]);
            if(tabName === 'watchlater') switchTab('watchlater', tabs[1]);
            updateUI();
        }
        function closeMediaCenter() { document.getElementById('mediaCenterModal').style.display = 'none'; }

        function switchTab(tabID, btnElement) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            
            if(tabID === 'history') document.getElementById('tabHistory').classList.add('active');
            if(tabID === 'watchlater') document.getElementById('tabWatchLater').classList.add('active');
            
            btnElement.classList.add('active');
        }

        function startPlayingLink() {
            const val = document.getElementById('mediaLink').value.trim();
            if(!val) { alert('Zəhmət olmasa link daxil edin!'); return; }
            document.getElementById('mediaLink').value = '';
            playFile(val, val);
        }

        function extractYouTubeID(url) {
            let regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            let match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        function addToHistory(name) {
            if(!historyList.some(item => item.fullLink === name)) {
                historyList.unshift({ name: name, fullLink: name });
            }
        }

        function playFile(fullLink, name) {
            currentActiveLink = fullLink;
            addToHistory(name);
            updateUI();

            document.getElementById('persistentMiniPlayer').style.display = 'flex';
            document.getElementById('miniSongTitle').innerHTML = `<i class="fa-solid fa-music" style="color: var(--primary-color);"></i> ` + name;
            document.getElementById('fullSongTitle').innerText = name;

            const artContainer = document.getElementById('playerArtContainer');
            let ytID = extractYouTubeID(fullLink);

            if(ytID) {
                artContainer.innerHTML = `<iframe src="https://www.youtube.com/embed/${ytID}?autoplay=1" allow="autoplay"></iframe>`;
                document.getElementById('miniPlayBtn').innerHTML = `<i class="fa-solid fa-pause"></i>`;
                document.getElementById('fullPlayBtn').innerHTML = `<i class="fa-solid fa-pause"></i>`;
            } else {
                globalAudio.src = fullLink;
                globalAudio.play().then(() => {
                    document.getElementById('miniPlayBtn').innerHTML = `<i class="fa-solid fa-pause"></i>`;
                    document.getElementById('fullPlayBtn').innerHTML = `<i class="fa-solid fa-pause"></i>`;
                }).catch(e => console.log(e));
                artContainer.innerHTML = `<i class="fa-solid fa-music" style="font-size: 40px; color: #38bdf8;"></i>`;
            }
            
            openFullPlayer();
        }

        function togglePlayPause() {
            let ytID = extractYouTubeID(currentActiveLink);
            if(ytID) {
                alert("YouTube videolarını birbaşa pleyerdən idarə etmək üçün üzərinə toxuna bilərsiniz.");
                return;
            }

            if (!globalAudio.paused) {
                globalAudio.pause();
                document.getElementById('miniPlayBtn').innerHTML = `<i class="fa-solid fa-play"></i>`;
                document.getElementById('fullPlayBtn').innerHTML = `<i class="fa-solid fa-play"></i>`;
            } else {
                globalAudio.play();
                document.getElementById('miniPlayBtn').innerHTML = `<i class="fa-solid fa-pause"></i>`;
                document.getElementById('fullPlayBtn').innerHTML = `<i class="fa-solid fa-pause"></i>`;
            }
        }

        function skipTime(seconds) {
            if(globalAudio && !extractYouTubeID(currentActiveLink)) {
                globalAudio.currentTime += seconds;
            }
        }

        globalAudio.addEventListener('timeupdate', () => {
            if(globalAudio.duration) {
                let progressPercent = (globalAudio.currentTime / globalAudio.duration) * 100;
                document.getElementById('miniSeeker').value = progressPercent;
                document.getElementById('fullSeeker').value = progressPercent;

                document.getElementById('currentTimeText').innerText = formatTime(globalAudio.currentTime);
                document.getElementById('durationText').innerText = formatTime(globalAudio.duration);
            }
        });

        document.getElementById('fullSeeker').addEventListener('input', (e) => {
            if(globalAudio.duration) {
                let seekTime = (e.target.value / 100) * globalAudio.duration;
                globalAudio.currentTime = seekTime;
            }
        });

        document.getElementById('miniSeeker').addEventListener('input', (e) => {
            if(globalAudio.duration) {
                let seekTime = (e.target.value / 100) * globalAudio.duration;
                globalAudio.currentTime = seekTime;
            }
        });

        function formatTime(seconds) {
            let mins = Math.floor(seconds / 60);
            let secs = Math.floor(seconds % 60);
            return `${mins < 10 ? '0' : ''}${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        function updateUI() {
            document.getElementById('hubHistoryCount').innerText = historyList.length + ' qeyd';
            document.getElementById('hubWatchLaterCount').innerText = watchLaterList.length + ' qeyd';

            const histContainer = document.getElementById('tabHistory');
            if(historyList.length === 0) {
                histContainer.innerHTML = '<div class="empty-text">Tarixçə boşdur.</div>';
            } else {
                let html = '';
                historyList.forEach((file) => {
                    html += `<li class="media-item-row" onclick="playFile('${file.fullLink}', '${file.name}')">
                        <div class="media-item-info"><i class="fa-solid fa-clock-rotate-left" style="color:#38bdf8;"></i><span>${file.name}</span></div>
                        <span class="badge">Dinlə</span>
                    </li>`;
                });
                histContainer.innerHTML = html;
            }

            const wlContainer = document.getElementById('tabWatchLater');
            if(watchLaterList.length === 0) {
                wlContainer.innerHTML = '<div class="empty-text">Seçilmişlər siyahısı boşdur.</div>';
            } else {
                let html = '';
                watchLaterList.forEach((file) => {
                    html += `<li class="media-item-row" onclick="playFile('${file.fullLink}', '${file.name}')">
                        <div class="media-item-info"><i class="fa-solid fa-bookmark" style="color:#eab308;"></i><span>${file.name}</span></div>
                        <span class="badge" style="background:#eab308; color:black;">Aç</span>
                    </li>`;
                });
                wlContainer.innerHTML = html;
            }
        }
    </script>
</body>
</html>
