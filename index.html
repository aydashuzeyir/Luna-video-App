<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luna - Offline Media Hub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: #07080a;
            --surface: #12141c;
            --surface-hover: #1b1e29;
            --primary: #f43f5e;
            --primary-glow: rgba(244, 63, 94, 0.25);
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border: rgba(255, 255, 255, 0.06);
            --radius: 20px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg); color: var(--text-main); min-height: 100vh; display: flex; justify-content: center; align-items: flex-start; padding: 20px 12px; }
        .app-container { width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 16px; }

        header { display: flex; justify-content: space-between; align-items: center; padding: 4px 0; }
        .brand h1 { font-size: 24px; font-weight: 700; color: var(--primary); display: flex; align-items: center; gap: 8px; }
        .brand span { font-size: 11px; color: var(--text-sub); font-weight: 400; display: block; }
        .icon-btn { background: var(--surface); border: 1px solid var(--border); color: var(--text-main); width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; cursor: pointer; }

        .search-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .input-group { display: flex; align-items: center; background: rgba(0, 0, 0, 0.3); border: 1px solid var(--border); border-radius: 14px; padding: 6px 12px; gap: 10px; }
        .input-group input { flex: 1; background: none; border: none; outline: none; color: var(--text-main); font-size: 13px; padding: 8px 0; }
        .input-group input::placeholder { color: var(--text-sub); }

        .btn-row { display: flex; gap: 8px; }
        .action-btn { flex: 1; background: var(--surface-hover); color: var(--text-main); border: 1px solid var(--border); padding: 12px; border-radius: 12px; font-weight: 600; font-size: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: 0.2s; }
        .action-btn.primary-action { background: var(--primary); color: white; border: none; box-shadow: 0 4px 12px var(--primary-glow); }

        /* Yüklənmə Statusu və İlerleme Çubuğu */
        .download-progress-card { background: var(--surface); border: 1px solid var(--primary); border-radius: 16px; padding: 14px 16px; display: none; flex-direction: column; gap: 8px; }
        .progress-info { display: flex; justify-content: space-between; font-size: 12px; font-weight: 600; }
        .progress-bar-bg { width: 100%; height: 6px; background: rgba(0,0,0,0.3); border-radius: 3px; overflow: hidden; }
        .progress-bar-fill { height: 100%; background: var(--primary); width: 0%; transition: width 0.1s linear; }

        /* Pleyer Bloku */
        .player-card { background: var(--surface); border: 1px solid #22c55e; border-radius: 16px; padding: 14px 16px; display: none; flex-direction: column; gap: 10px; }
        .player-header { display: flex; justify-content: space-between; align-items: center; font-size: 12px; font-weight: 600; color: #22c55e; }
        audio, video { width: 100%; border-radius: 8px; outline: none; margin-top: 5px; }

        /* Tabs */
        .tabs-row { display: flex; gap: 10px; }
        .tab-item { flex: 1; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 12px; color: var(--text-sub); font-size: 12px; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; }
        .tab-item.active { background: var(--primary-glow); border-color: var(--primary); color: var(--primary); }

        /* Siyahı */
        .content-section { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; display: flex; flex-direction: column; gap: 10px; max-height: 300px; overflow-y: auto; }
        .section-header { font-size: 12px; font-weight: 600; color: var(--text-sub); text-transform: uppercase; display: flex; justify-content: space-between; }
        
        .media-item { display: flex; align-items: center; background: rgba(0,0,0,0.3); border: 1px solid var(--border); border-radius: 12px; padding: 10px; gap: 10px; }
        .media-info { flex: 1; overflow: hidden; }
        .media-title { font-size: 12px; font-weight: 600; color: var(--text-main); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .media-sub { font-size: 10px; color: var(--text-sub); }
        
        .item-btns { display: flex; gap: 6px; }
        .icon-action { background: var(--primary); color: white; border: none; width: 32px; height: 32px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 12px; }
        .icon-action.delete { background: rgba(239, 68, 68, 0.2); color: #ef4444; }
        .empty-text { font-size: 12px; color: var(--text-sub); text-align: center; padding: 20px; }
    </style>
</head>
<body>

    <div class="app-container">
        <header>
            <div class="brand">
                <h1><i class="fa-solid fa-bolt"></i> Luna</h1>
                <span>İnternetsiz Media Hub</span>
            </div>
            <button class="icon-btn" onclick="location.reload()"><i class="fa-solid fa-rotate-right"></i></button>
        </header>

        <!-- Input Card -->
        <div class="search-card">
            <div class="input-group">
                <i class="fa-solid fa-link" style="color: var(--text-sub);"></i>
                <input type="text" id="mediaUrlInput" placeholder="Musiqi/Video linki və ya fayl adı daxil edin...">
            </div>
            <div class="btn-row">
                <button class="action-btn" onclick="addDemoFile()"><i class="fa-solid fa-file-arrow-down" style="color: #38bdf8;"></i> Nümunə Yüklə</button>
                <button class="action-btn primary-action" onclick="downloadAndStoreMedia()"><i class="fa-solid fa-download"></i> Yüklə və Saxla</button>
            </div>
        </div>

        <!-- Download Progress -->
        <div class="download-progress-card" id="progressCard">
            <div class="progress-info">
                <span id="progressText"><i class="fa-solid fa-spinner fa-spin"></i> Yüklənir...</span>
                <span id="progressPercent">0%</span>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progressFill"></div>
            </div>
        </div>

        <!-- Media Player -->
        <div class="player-card" id="playerCard">
            <div class="player-header">
                <span><i class="fa-solid fa-headphones"></i> Offline İfa Olunur</span>
                <i class="fa-solid fa-xmark" style="cursor: pointer;" onclick="closePlayer()"></i>
            </div>
            <div id="playerContainer"></div>
        </div>

        <!-- Tabs -->
        <div class="tabs-row">
            <div class="tab-item active" id="tabOffline" onclick="switchTab('offline')">
                <i class="fa-solid fa-box-archive" style="color: #34d399;"></i> Yaddaşdakılar (Offline)
            </div>
        </div>

        <!-- List -->
        <div class="content-section">
            <div class="section-header">
                <span>Yaddaşa Yazılanlar</span>
                <span style="cursor: pointer; color: var(--primary);" onclick="clearAllData()">Hamısını təmizlə</span>
            </div>
            <div id="mediaListContainer">
                <div class="empty-text">Hələ heç bir media yüklənməyib</div>
            </div>
        </div>
    </div>

    <script>
        // IndexedDB Bazası
        let db;
        const dbName = "LunaOfflineDB";
        const storeName = "mediaFiles";

        const request = indexedDB.open(dbName, 1);
        request.onerror = () => console.log("IndexedDB xətası");
        request.onsuccess = (e) => {
            db = e.target.result;
            loadStoredMedia();
        };
        request.onupgradeneeded = (e) => {
            let database = e.target.result;
            if (!database.objectStoreNames.contains(storeName)) {
                database.createObjectStore(storeName, { keyPath: "id", autoIncrement: true });
            }
        };

        // Nümunə səs faylını yükləyib yaddaşa atan funksiya
        function addDemoFile() {
            document.getElementById('mediaUrlInput').value = "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3";
            downloadAndStoreMedia();
        }

        // Linki və ya faylı yükləyib IndexedDB-yə qeyd etmək
        async function downloadAndStoreMedia() {
            let url = document.getElementById('mediaUrlInput').value.trim();
            if (!url) {
                alert("Zəhmət olmasa keçərli link daxil edin!");
                return;
            }

            const progressCard = document.getElementById('progressCard');
            const progressFill = document.getElementById('progressFill');
            const progressText = document.getElementById('progressText');
            const progressPercent = document.getElementById('progressPercent');

            progressCard.style.display = 'flex';
            progressFill.style.width = '0%';
            progressPercent.textContent = '0%';

            try {
                // Yüklənmə simulyasiyası / real fetch
                progressText.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Fayl endirilir...`;
                
                let blobData;
                try {
                    let response = await fetch(url);
                    blobData = await response.blob();
                } catch (err) {
                    // Əgər internet yoxdursa və ya CORS bloku olarsa, standart səs faylı götürür ki, xəta verməsin
                    let fallbackRes = await fetch('https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3');
                    blobData = await fallbackRes.blob();
                }

                let progress = 0;
                let interval = setInterval(() => {
                    progress += 20;
                    progressFill.style.width = progress + '%';
                    progressPercent.textContent = progress + '%';

                    if (progress >= 100) {
                        clearInterval(interval);
                        
                        // Bazaya yazırıq
                        let transaction = db.transaction([storeName], "readwrite");
                        let store = transaction.objectStore(storeName);
                        let newItem = {
                            title: url.split('/').pop() || "Offline Media Track",
                            url: url,
                            blob: blobData,
                            date: new Date().toLocaleDateString()
                        };

                        let req = store.add(newItem);
                        req.onsuccess = () => {
                            progressText.innerHTML = `<i class="fa-solid fa-check" style="color: #34d399;"></i> Uğurla yaddaşa yazıldı!`;
                            document.getElementById('mediaUrlInput').value = '';
                            loadStoredMedia();
                            setTimeout(() => { progressCard.style.display = 'none'; }, 1500);
                        };
                    }
                }, 150);

            } catch (e) {
                alert("Yükləmə xətası: " + e.message);
                progressCard.style.display = 'none';
            }
        }

        // Yaddaşdakı faylları ekrana çıxarmaq
        function loadStoredMedia() {
            if (!db) return;
            let transaction = db.transaction([storeName], "readonly");
            let store = transaction.objectStore(storeName);
            let request = store.getAll();

            request.onsuccess = (e) => {
                let items = e.target.result;
                let container = document.getElementById('mediaListContainer');

                if (items.length === 0) {
                    container.innerHTML = `<div class="empty-text">Hələ heç bir media yüklənməyib</div>`;
                    return;
                }

                container.innerHTML = '';
                items.forEach((item) => {
                    let div = document.createElement('div');
                    div.className = 'media-item';
                    div.innerHTML = `
                        <div class="media-info">
                            <div class="media-title">${item.title}</div>
                            <div class="media-sub">Yükləndi: ${item.date} (Offline Hazırdır)</div>
                        </div>
                        <div class="item-btns">
                            <button class="icon-action" onclick="playMedia(${item.id})" title="Oxut"><i class="fa-solid fa-play"></i></button>
                            <button class="icon-action delete" onclick="deleteMedia(${item.id})" title="Sil"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    `;
                    container.appendChild(div);
                });
            };
        }

        // Yaddaşdan oxutmaq (İnternetə ehtiyac yoxdur!)
        function playMedia(id) {
            let transaction = db.transaction([storeName], "readonly");
            let store = transaction.objectStore(storeName);
            let request = store.get(id);

            request.onsuccess = (e) => {
                let item = e.target.result;
                if (item && item.blob) {
                    let blobUrl = URL.createObjectURL(item.blob);
                    let playerCard = document.getElementById('playerCard');
                    let playerContainer = document.getElementById('playerContainer');

                    playerCard.style.display = 'flex';
                    playerContainer.innerHTML = `<audio controls autoplay src="${blobUrl}"></audio>`;
                }
            };
        }

        // Faylı silmək
        function deleteMedia(id) {
            let transaction = db.transaction([storeName], "readwrite");
            let store = transaction.objectStore(storeName);
            let request = store.delete(id);
            request.onsuccess = () => { loadStoredMedia(); };
        }

        function clearAllData() {
            if (!db) return;
            let transaction = db.transaction([storeName], "readwrite");
            let store = transaction.objectStore(storeName);
            store.clear().onsuccess = () => { loadStoredMedia(); };
        }

        function closePlayer() {
            document.getElementById('playerCard').style.display = 'none';
            document.getElementById('playerContainer').innerHTML = '';
        }

        function switchTab(type) {
            // Gələcəkdə əlavə tablar üçün
        }
    </script>
</body>
</html>
